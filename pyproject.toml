[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
version = "0.10.11"
description = "Network reconnaissance and evidence-based vulnerability assessment toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mazen Taha" }]
dependencies = [
    "python-nmap==0.7.1",
    "requests>=2.31.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
reconforge = "reconforge.scanner:main"
reconforge-report = "reconforge.report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
