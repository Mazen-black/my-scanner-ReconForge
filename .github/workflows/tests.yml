name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile project modules
        run: python -m compileall -q src/reconforge scanner.py assessment.py report.py risk.py asset_context.py remediation.py

      - name: Run test suite
        run: python -m unittest discover -s tests -v
  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Debian package
        run: sh packaging/build-deb.sh

      - name: Validate Debian package metadata
        run: |
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb --field "$package" Package)" = "reconforge"
          test "$(dpkg-deb --field "$package" Architecture)" = "all"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
